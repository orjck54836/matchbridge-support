<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>單字練習工具</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:#faf9f6;color:#1c1c1a;min-height:100vh;padding:2rem 1rem 4rem}
#app{max-width:640px;margin:0 auto}
h1{font-family:'DM Serif Display',serif;font-size:28px;font-weight:400;margin-bottom:3px}
.sub{font-size:13px;color:#999;margin-bottom:1.5rem}
.tabs{display:flex;background:#edece8;border-radius:12px;padding:3px;margin-bottom:1.5rem;gap:3px}
.tab{flex:1;padding:9px;border:none;border-radius:9px;font-size:13px;font-family:'DM Sans',sans-serif;font-weight:500;cursor:pointer;background:transparent;color:#888;transition:all 0.18s}
.tab.on{background:#fff;color:#1c1c1a;box-shadow:0 1px 4px rgba(0,0,0,0.09)}
.sec{display:none}.sec.on{display:block}
.box{background:#fff;border:1px solid #e8e7e2;border-radius:14px;padding:1rem 1.1rem;margin-bottom:12px}
.srow{display:flex;gap:10px;margin-bottom:1.25rem}
.sbox{flex:1;background:#fff;border:1px solid #e8e7e2;border-radius:12px;padding:.75rem;text-align:center}
.sn{font-size:22px;font-weight:600}.sl{font-size:12px;color:#aaa;margin-top:2px}
.mrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1rem}
.mbtn{padding:7px 14px;border:1.5px solid #e8e7e2;border-radius:20px;font-size:13px;font-family:'DM Sans',sans-serif;background:#fff;cursor:pointer;color:#999;transition:all 0.15s}
.mbtn.on{border-color:#1c1c1a;color:#1c1c1a}
.btn{border:none;border-radius:9px;padding:9px 18px;font-size:13px;font-family:'DM Sans',sans-serif;font-weight:500;cursor:pointer;transition:all 0.15s}
.btn:active{transform:scale(0.97)}
.btn:disabled{opacity:0.35;cursor:default}
.btn-ink{background:#1c1c1a;color:#fff}
.btn-soft{background:#edece8;color:#555;border:none}
.badge{font-size:11px;font-weight:500;padding:2px 9px;border-radius:20px}
.bpos{background:#f0efe9;color:#777}
.bspeak{background:#e2f5ee;color:#1a6b4a}
.bformal{background:#eeeeff;color:#4444aa}
.wcard{background:#fff;border:1px solid #e8e7e2;border-radius:14px;padding:1rem 1.1rem;margin-bottom:10px;animation:up 0.2s ease}
@keyframes up{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.whead{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:4px}
.wtitle{font-size:20px;font-family:'DM Serif Display',serif;font-weight:400}
.wkk{font-size:13px;color:#aaa;font-family:monospace;margin-bottom:8px}
.wrow{display:flex;gap:8px;margin-bottom:6px}
.wl{font-size:12px;color:#bbb;min-width:50px;flex-shrink:0;padding-top:2px}
.wv{font-size:14px;color:#444;line-height:1.6;flex:1}
.altbox{font-size:13px;color:#1a6b4a;background:#e2f5ee;border-radius:8px;padding:7px 10px;margin:6px 0;line-height:1.6}
.exline{font-size:14px;color:#555;line-height:1.7;border-left:2px solid #e8e7e2;padding-left:10px;margin-top:6px}
.exline em{font-style:normal;font-weight:600;color:#1c1c1a}
.hr{height:1px;background:#f0efe9;margin:8px 0}
.qcard{background:#fff;border:1px solid #e8e7e2;border-radius:16px;padding:1.5rem;margin-bottom:12px}
.qword{font-size:32px;font-family:'DM Serif Display',serif;font-weight:400;text-align:center;margin-bottom:2px}
.qkk{font-size:13px;color:#bbb;text-align:center;font-family:monospace;margin-bottom:4px}
.qpos{font-size:13px;color:#aaa;text-align:center;margin-bottom:1.5rem}
.qprompt{font-size:13px;color:#bbb;text-align:center;margin-bottom:1rem}
.choices{display:flex;flex-direction:column;gap:8px}
.ch{padding:12px 16px;border:1.5px solid #e8e7e2;border-radius:10px;font-size:15px;background:#fff;cursor:pointer;text-align:left;font-family:'DM Sans',sans-serif;color:#1c1c1a;transition:all 0.15s;line-height:1.5}
.ch:hover{border-color:#ccc;background:#fafaf7}
.ch.ok{background:#e2f5ee;border-color:#2d9e72;color:#1a6b4a}
.ch.no{background:#fff0f0;border-color:#e05050;color:#a03030}
.ch.dim{background:#f7f6f2;border-color:#e8e7e2;color:#bbb;cursor:default}
.qres{margin-top:1rem;display:none}.qres.on{display:block}
.qok{background:#e2f5ee;color:#1a6b4a;border-radius:10px;padding:9px 12px;margin-bottom:7px;font-size:14px}
.qno{background:#fff0f0;color:#a03030;border-radius:10px;padding:9px 12px;margin-bottom:7px;font-size:14px}
.qex{font-size:13px;color:#666;line-height:1.7;border-left:2px solid #e8e7e2;padding-left:10px;margin-top:6px}
.qex em{font-style:normal;font-weight:600;color:#1c1c1a}
.qnav{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.qct{font-size:13px;color:#bbb}
.filinput{width:100%;border:2px solid #e8e7e2;border-radius:10px;padding:12px;font-size:22px;font-family:'DM Serif Display',serif;outline:none;text-align:center;margin-bottom:10px;background:#fff;color:#1c1c1a;letter-spacing:1px;transition:border-color 0.15s}
.filinput:focus{border-color:#aaa}
.filinput.ok{border-color:#2d9e72;background:#e2f5ee;color:#1a6b4a}
.filinput.no{border-color:#e05050;background:#fff0f0;color:#a03030}
.summ{text-align:center;padding:2rem 1rem;background:#fff;border:1px solid #e8e7e2;border-radius:16px}
.spct{font-size:48px;font-family:'DM Serif Display',serif;font-weight:400;margin-bottom:4px}
.smsg{font-size:14px;color:#888;margin-bottom:1.5rem}
.sbtns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
input[type=text]{font-family:'DM Sans',sans-serif;font-size:14px;color:#1c1c1a;background:#f7f6f2;border:1px solid #e8e7e2;border-radius:8px;outline:none;padding:9px 12px;width:100%}
input[type=text]:focus{border-color:#aaa}
input::placeholder{color:#ccc}
.loading{text-align:center;padding:3rem 1rem;color:#aaa;font-size:14px}
.spin{width:28px;height:28px;border:3px solid #e8e7e2;border-top-color:#999;border-radius:50%;animation:sp 0.7s linear infinite;margin:0 auto 1rem}
@keyframes sp{to{transform:rotate(360deg)}}
.err-box{background:#fff8f8;border:1px solid #f5d0d0;border-radius:14px;padding:1.5rem;text-align:center;color:#b44;font-size:14px;line-height:1.8}
.err-box a{color:#b44}
.setup-box{background:#fff;border:1px solid #e8e7e2;border-radius:14px;padding:1.5rem;margin-bottom:12px}
.setup-box h3{font-size:15px;font-weight:600;margin-bottom:0.75rem}
.setup-box p{font-size:13px;color:#777;line-height:1.7;margin-bottom:0.75rem}
.setup-box code{background:#f0efe9;padding:2px 6px;border-radius:4px;font-size:12px;font-family:monospace}
.irow{display:flex;gap:8px}
input[type=url]{font-family:'DM Sans',sans-serif;font-size:13px;color:#1c1c1a;background:#f7f6f2;border:1px solid #e8e7e2;border-radius:8px;outline:none;padding:9px 12px;flex:1}
input[type=url]:focus{border-color:#aaa}
.astatus{font-size:12px;margin-top:6px}
.aok{color:#2d7a5f}.ano{color:#b44}
.reload-btn{display:flex;align-items:center;gap:6px;font-size:13px;color:#aaa;background:none;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;padding:0;margin-bottom:1rem}
.reload-btn:hover{color:#1c1c1a}
</style>
</head>
<body>
<div id="app">
  <h1>單字練習工具</h1>
  <p class="sub" id="word-count">載入中...</p>

  <div id="setup-section">
    <div class="setup-box">
      <h3>📋 設定 Google Sheets 來源</h3>
      <p>把你的 Google Sheets 發布為 CSV，貼上網址即可同步單字庫。<br>
      步驟：試算表 → <strong>檔案 → 共用 → 發布到網路</strong> → 選 <strong>CSV</strong> → 複製連結</p>
      <div class="irow">
        <input type="url" id="sheetUrl" placeholder="https://docs.google.com/spreadsheets/d/.../pub?output=csv">
        <button class="btn btn-ink" onclick="saveSheet()">儲存</button>
      </div>
      <div class="astatus" id="sheetStatus"></div>
    </div>
  </div>

  <div id="main-section" style="display:none">
    <button class="reload-btn" onclick="reloadData()">↻ 重新從 Google Sheets 載入</button>
    <div class="tabs">
      <button class="tab on" onclick="go('quiz')">測驗</button>
      <button class="tab" onclick="go('bank')">單字庫</button>
      <button class="tab" onclick="go('settings')">設定</button>
    </div>

    <div class="sec on" id="sec-quiz">
      <div class="srow">
        <div class="sbox"><div class="sn" id="st">0</div><div class="sl">單字</div></div>
        <div class="sbox"><div class="sn" id="sc" style="color:#2d7a5f">0</div><div class="sl">答對</div></div>
        <div class="sbox"><div class="sn" id="sw" style="color:#b44">0</div><div class="sl">答錯</div></div>
      </div>
      <div class="mrow">
        <button class="mbtn on" id="m-mc" onclick="setMode('mc')">選擇題</button>
        <button class="mbtn" id="m-fill" onclick="setMode('fill')">填空拼字</button>
        <button class="mbtn" id="m-spoken" onclick="setMode('spoken')">口語判斷</button>
      </div>
      <div id="qa"></div>
    </div>

    <div class="sec" id="sec-bank">
      <div class="box" style="margin-bottom:12px">
        <input type="text" id="search" placeholder="搜尋單字或中文..." oninput="renderBank()">
      </div>
      <div id="bank-list"></div>
    </div>

    <div class="sec" id="sec-settings">
      <div class="setup-box">
        <h3>Google Sheets 網址</h3>
        <p>更改資料來源，或重新載入最新單字。</p>
        <div class="irow">
          <input type="url" id="sheetUrl2" placeholder="https://docs.google.com/spreadsheets/d/.../pub?output=csv">
          <button class="btn btn-ink" onclick="saveSheet2()">更新</button>
        </div>
        <div class="astatus" id="sheetStatus2"></div>
        <br>
        <button class="btn btn-soft" onclick="reloadData()">↻ 重新載入單字</button>
      </div>
    </div>
  </div>

  <div id="loading-section" style="display:none">
    <div class="loading"><div class="spin"></div>載入單字中...</div>
  </div>
  <div id="error-section" style="display:none">
    <div class="err-box" id="err-msg"></div>
  </div>
</div>

<script>
const SHEET_KEY = 'vocab_sheet_url';
let vocab = [], deck = [], idx = 0, mode = 'mc', score = {c:0,w:0}, done = false;

function loadSheet(){
  const url = localStorage.getItem(SHEET_KEY)||'';
  if(url){
    document.getElementById('sheetUrl').value = url;
    document.getElementById('sheetUrl2').value = url;
    document.getElementById('setup-section').style.display = 'none';
    fetchVocab(url);
  }
}

function saveSheet(){
  const url = document.getElementById('sheetUrl').value.trim();
  doSaveSheet(url, 'sheetStatus');
}
function saveSheet2(){
  const url = document.getElementById('sheetUrl2').value.trim();
  doSaveSheet(url, 'sheetStatus2');
}
function doSaveSheet(url, statusId){
  if(!url.includes('docs.google.com')){
    document.getElementById(statusId).textContent = '請貼上正確的 Google Sheets 網址';
    document.getElementById(statusId).className = 'astatus ano';
    return;
  }
  localStorage.setItem(SHEET_KEY, url);
  document.getElementById(statusId).textContent = '已儲存，載入中...';
  document.getElementById(statusId).className = 'astatus aok';
  document.getElementById('setup-section').style.display = 'none';
  fetchVocab(url);
}

function reloadData(){
  const url = localStorage.getItem(SHEET_KEY)||'';
  if(url) fetchVocab(url);
}

async function fetchVocab(url){
  document.getElementById('loading-section').style.display = 'block';
  document.getElementById('main-section').style.display = 'none';
  document.getElementById('error-section').style.display = 'none';

  // Make sure URL has output=csv
  let csvUrl = url;
  if(!csvUrl.includes('output=csv')){
    csvUrl = csvUrl.split('?')[0] + '?output=csv';
  }
  // Add cache buster
  csvUrl += '&t=' + Date.now();

  try{
    const res = await fetch(csvUrl);
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    vocab = parseCSV(text);
    if(vocab.length === 0) throw new Error('試算表是空的，或格式不正確');
    document.getElementById('loading-section').style.display = 'none';
    document.getElementById('main-section').style.display = 'block';
    document.getElementById('word-count').textContent = vocab.length + ' 個單字 · KK音標 · 口語程度 · 三種測驗';
    document.getElementById('st').textContent = vocab.length;
    initQuiz();
  } catch(e){
    document.getElementById('loading-section').style.display = 'none';
    document.getElementById('error-section').style.display = 'block';
    document.getElementById('err-msg').innerHTML = `
      <strong>載入失敗</strong><br><br>
      錯誤：${e.message}<br><br>
      請確認：<br>
      1. 試算表已發布（檔案 → 共用 → 發布到網路）<br>
      2. 選擇的格式是 <strong>CSV</strong><br>
      3. 網址格式正確（包含 <code>/pub?output=csv</code>）<br><br>
      <button class="btn btn-ink" onclick="document.getElementById('error-section').style.display='none';document.getElementById('setup-section').style.display='block'">重新設定</button>
    `;
  }
}

function parseCSV(text){
  const lines = text.trim().split('\n');
  if(lines.length < 2) return [];
  const header = parseCSVRow(lines[0]).map(h => h.trim().toLowerCase());
  const results = [];
  for(let i = 1; i < lines.length; i++){
    if(!lines[i].trim()) continue;
    const cols = parseCSVRow(lines[i]);
    const obj = {};
    header.forEach((h, idx) => { obj[h] = (cols[idx]||'').trim(); });
    if(!obj.word) continue;
    results.push({
      word: obj.word,
      pos: obj.pos || '',
      kk: obj.kk || '',
      chinese: obj.chinese || '',
      is_spoken: obj.is_spoken && obj.is_spoken.toUpperCase() === 'TRUE',
      spoken_alternative: obj.spoken_alternative || '',
      example: obj.example || ''
    });
  }
  return results;
}

function parseCSVRow(row){
  const result = [];
  let cur = '', inQ = false;
  for(let i = 0; i < row.length; i++){
    const c = row[i];
    if(c === '"'){
      if(inQ && row[i+1] === '"'){ cur += '"'; i++; }
      else inQ = !inQ;
    } else if(c === ',' && !inQ){
      result.push(cur); cur = '';
    } else {
      cur += c;
    }
  }
  result.push(cur);
  return result;
}

function go(t){
  ['quiz','bank','settings'].forEach(s => document.getElementById('sec-'+s).classList.toggle('on', s===t));
  document.querySelectorAll('.tab').forEach((b,i) => b.classList.toggle('on', ['quiz','bank','settings'][i]===t));
  if(t==='bank') renderBank();
}

function bold(s,w){
  return (s||'').replace(/\*\*([^*]+)\*\*/g,'<em>$1</em>').replace(new RegExp('\\b('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')\\b','gi'),'<em>$1</em>');
}

function mkWCard(d){
  const el = document.createElement('div'); el.className = 'wcard';
  const sb = d.is_spoken ? '<span class="badge bspeak">口語常用</span>' : '<span class="badge bformal">書面/正式</span>';
  const alt = (!d.is_spoken && d.spoken_alternative) ? `<div class="altbox">口語說法：${d.spoken_alternative}</div>` : '';
  el.innerHTML = `<div class="whead"><span class="wtitle">${d.word}</span><span class="badge bpos">${d.pos}</span>${sb}</div>
<div class="wkk">${d.kk}</div>
<div class="wrow"><span class="wl">中文</span><span class="wv">${d.chinese}</span></div>${alt}
<div class="hr"></div><div class="exline">${bold(d.example, d.word)}</div>`;
  return el;
}

function renderBank(){
  const q = (document.getElementById('search').value||'').toLowerCase();
  const filtered = vocab.filter(v => v.word.toLowerCase().includes(q) || v.chinese.includes(q));
  const list = document.getElementById('bank-list'); list.innerHTML = '';
  if(!filtered.length){ list.innerHTML = '<div style="text-align:center;padding:2rem;color:#bbb;font-size:14px">找不到符合的單字</div>'; return; }
  filtered.forEach(d => list.appendChild(mkWCard(d)));
}

function initQuiz(){
  score = {c:0,w:0}; updScore(); deck = shuf([...vocab]); idx = 0; done = false; render();
}
function setMode(m){
  mode = m; ['mc','fill','spoken'].forEach(id => document.getElementById('m-'+id).classList.toggle('on', id===m));
  deck = shuf([...vocab]); idx = 0; score = {c:0,w:0}; updScore(); done = false; render();
}
function updScore(){ document.getElementById('sc').textContent = score.c; document.getElementById('sw').textContent = score.w; }
function shuf(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a; }

function render(){
  const qa = document.getElementById('qa');
  if(idx >= deck.length){ renderSum(qa); return; }
  const item = deck[idx]; done = false;
  if(mode==='mc') renderMC(qa, item);
  else if(mode==='fill') renderFill(qa, item);
  else renderSpoken(qa, item);
}
function nav(){ return `<div class="qnav"><span class="qct">${idx+1} / ${deck.length}</span><button class="btn btn-ink" id="nxt" onclick="next()" style="display:none">下一題 →</button></div>`; }

function renderMC(qa, item){
  const others = shuf(vocab.filter(v=>v.word!==item.word)).slice(0,3).map(v=>v.chinese);
  const choices = shuf([item.chinese, ...others]);
  qa.innerHTML = `<div class="qcard"><div class="qword">${item.word}</div><div class="qkk">${item.kk}</div><div class="qpos">${item.pos}</div>
<div class="qprompt">選出正確的中文意思</div>
<div class="choices">${choices.map(c=>`<button class="ch" onclick="chkMC(this,'${esc(c)}','${esc(item.chinese)}')">${c}</button>`).join('')}</div>
<div class="qres" id="qr"></div></div>${nav()}`;
}
function chkMC(btn, chosen, correct){
  if(done) return; done = true;
  const ok = chosen===correct;
  if(ok){score.c++;btn.classList.add('ok');}
  else{score.w++;btn.classList.add('no');document.querySelectorAll('.ch').forEach(b=>{if(b.textContent.trim()===correct)b.classList.add('ok');else if(!b.classList.contains('no'))b.classList.add('dim');});}
  updScore(); showRes(ok);
}

function renderFill(qa, item){
  qa.innerHTML = `<div class="qcard"><div class="qpos" style="margin-bottom:4px">${item.pos}</div>
<div class="qword" style="font-size:18px;font-family:'DM Sans',sans-serif;color:#888;font-weight:400;margin-bottom:4px">${item.chinese}</div>
<div class="qkk" style="text-align:center;margin-bottom:1rem">${item.kk}</div>
<div class="qprompt">拼出這個英文單字</div>
<input class="filinput" id="fi" type="text" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" placeholder="輸入英文...">
<div style="text-align:center"><button class="btn btn-ink" onclick="chkFill('${esc(item.word)}')">確認</button></div>
<div class="qres" id="qr"></div></div>${nav()}`;
  const fi = document.getElementById('fi'); fi.focus();
  fi.addEventListener('keydown', e=>{ if(e.key==='Enter') chkFill(item.word); });
}
function chkFill(correct){
  if(done) return; const fi = document.getElementById('fi'); const val = fi.value.trim().toLowerCase(); if(!val) return;
  done = true; const ok = val===correct.toLowerCase();
  fi.classList.add(ok?'ok':'no'); if(ok) score.c++; else{score.w++;fi.value=correct;}
  updScore(); showRes(ok);
}

function renderSpoken(qa, item){
  qa.innerHTML = `<div class="qcard"><div class="qword">${item.word}</div><div class="qkk">${item.kk}</div>
<div class="qpos">${item.pos} — ${item.chinese}</div>
<div class="qprompt" style="margin-top:1rem">這個單字在日常口語中常用嗎？</div>
<div class="choices" style="flex-direction:row;gap:10px;display:flex">
  <button class="ch" style="flex:1;text-align:center" onclick="chkSpoken(this,true,${item.is_spoken})">是，口語常用</button>
  <button class="ch" style="flex:1;text-align:center" onclick="chkSpoken(this,false,${item.is_spoken})">不是，較書面</button>
</div>
<div class="qres" id="qr"></div></div>${nav()}`;
}
function chkSpoken(btn, chosen, correct){
  if(done) return; done = true; const ok = chosen===correct;
  if(ok){score.c++;btn.classList.add('ok');}
  else{score.w++;btn.classList.add('no');document.querySelectorAll('.ch').forEach(b=>{const bv=b.textContent.includes('口語');if(bv===correct)b.classList.add('ok');else if(!b.classList.contains('no'))b.classList.add('dim');});}
  updScore(); showRes(ok);
}

function showRes(ok){
  const item = deck[idx], el = document.getElementById('qr');
  const alt = (!item.is_spoken && item.spoken_alternative) ? `<div style="margin-top:6px;font-size:13px">口語說法：${item.spoken_alternative}</div>` : '';
  el.className = 'qres on';
  el.innerHTML = `<div class="${ok?'qok':'qno'}">${ok?'答對了！':'答錯了 — 正確答案：'+item.chinese}</div>${alt}<div class="qex">${bold(item.example, item.word)}</div>`;
  document.getElementById('nxt').style.display = 'inline-block';
}
function next(){ idx++; done = false; render(); }

function renderSum(qa){
  const total = score.c+score.w, pct = total ? Math.round(score.c/total*100) : 0;
  const msg = pct>=80 ? '很棒，繼續保持！' : pct>=50 ? '還不錯，再複習一下！' : '繼續加油！';
  qa.innerHTML = `<div class="summ"><div class="spct">${pct}%</div><div class="smsg">${score.c} / ${total} 答對 &nbsp;·&nbsp; ${msg}</div>
<div class="sbtns"><button class="btn btn-ink" onclick="reAll()">再來一次</button><button class="btn btn-soft" onclick="reMiss()">換個模式</button></div></div>`;
}
function reAll(){ deck=shuf([...vocab]);idx=0;score={c:0,w:0};updScore();done=false;render(); }
function reMiss(){ const modes=['mc','fill','spoken']; setMode(modes[(modes.indexOf(mode)+1)%modes.length]); }
function esc(s){ return (s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

loadSheet();
</script>
