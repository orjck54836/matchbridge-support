<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>單字練習工具</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:#faf9f6;color:#1c1c1a;min-height:100vh;padding:2rem 1rem 4rem}
#app{max-width:640px;margin:0 auto}
h1{font-family:'DM Serif Display',serif;font-size:28px;font-weight:400;margin-bottom:3px}
.sub{font-size:13px;color:#999;margin-bottom:1.5rem}
.tabs{display:flex;background:#edece8;border-radius:12px;padding:3px;margin-bottom:1.5rem;gap:3px}
.tab{flex:1;padding:9px;border:none;border-radius:9px;font-size:13px;font-family:'DM Sans',sans-serif;font-weight:500;cursor:pointer;background:transparent;color:#888;transition:all 0.18s}
.tab.on{background:#fff;color:#1c1c1a;box-shadow:0 1px 4px rgba(0,0,0,0.09)}
.sec{display:none}.sec.on{display:block}
.box{background:#fff;border:1px solid #e8e7e2;border-radius:14px;padding:1rem 1.1rem;margin-bottom:12px}
.srow{display:flex;gap:8px;margin-bottom:1.25rem}
.sbox{flex:1;background:#fff;border:1px solid #e8e7e2;border-radius:12px;padding:.75rem;text-align:center}
.sn{font-size:20px;font-weight:600}.sl{font-size:11px;color:#aaa;margin-top:2px}
.sn.red{color:#b44}.sn.green{color:#2d7a5f}.sn.orange{color:#b07020}
.mrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1rem}
.mbtn{padding:7px 14px;border:1.5px solid #e8e7e2;border-radius:20px;font-size:13px;font-family:'DM Sans',sans-serif;background:#fff;cursor:pointer;color:#999;transition:all 0.15s}
.mbtn.on{border-color:#1c1c1a;color:#1c1c1a}
.btn{border:none;border-radius:9px;padding:9px 18px;font-size:13px;font-family:'DM Sans',sans-serif;font-weight:500;cursor:pointer;transition:all 0.15s}
.btn:active{transform:scale(0.97)}
.btn:disabled{opacity:0.35;cursor:default}
.btn-ink{background:#1c1c1a;color:#fff}
.btn-soft{background:#edece8;color:#555;border:none}
.btn-red{background:#fff0f0;color:#a03030;border:none}
.btn-orange{background:#fff8ec;color:#8a5a00;border:none}
.btn-full{width:100%}
.badge{font-size:11px;font-weight:500;padding:2px 9px;border-radius:20px}
.bpos{background:#f0efe9;color:#777}
.bspeak{background:#e2f5ee;color:#1a6b4a}
.bformal{background:#eeeeff;color:#4444aa}
.wcard{background:#fff;border:1px solid #e8e7e2;border-radius:14px;padding:1rem 1.1rem;margin-bottom:10px;animation:up 0.2s ease}
@keyframes up{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.whead{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:4px}
.wtitle{font-size:20px;font-family:'DM Serif Display',serif;font-weight:400}
.wkk{font-size:13px;color:#aaa;font-family:monospace;margin-bottom:8px}
.wrow{display:flex;gap:8px;margin-bottom:6px}
.wl{font-size:12px;color:#bbb;min-width:50px;flex-shrink:0;padding-top:2px}
.wv{font-size:14px;color:#444;line-height:1.6;flex:1}
.altbox{font-size:13px;color:#1a6b4a;background:#e2f5ee;border-radius:8px;padding:7px 10px;margin:6px 0;line-height:1.6}
.exline{font-size:14px;color:#555;line-height:1.7;border-left:2px solid #e8e7e2;padding-left:10px;margin-top:6px}
.exline em{font-style:normal;font-weight:600;color:#1c1c1a}
.hr{height:1px;background:#f0efe9;margin:8px 0}
.qcard{background:#fff;border:1px solid #e8e7e2;border-radius:16px;padding:1.5rem;margin-bottom:12px}
.qword{font-size:32px;font-family:'DM Serif Display',serif;font-weight:400;text-align:center;margin-bottom:2px}
.qkk{font-size:13px;color:#bbb;text-align:center;font-family:monospace;margin-bottom:4px}
.qpos{font-size:13px;color:#aaa;text-align:center;margin-bottom:1.5rem}
.qprompt{font-size:13px;color:#bbb;text-align:center;margin-bottom:1rem}
.choices{display:flex;flex-direction:column;gap:8px}
.ch{padding:12px 16px;border:1.5px solid #e8e7e2;border-radius:10px;font-size:15px;background:#fff;cursor:pointer;text-align:left;font-family:'DM Sans',sans-serif;color:#1c1c1a;transition:all 0.15s;line-height:1.5}
.ch:hover{border-color:#ccc;background:#fafaf7}
.ch.ok{background:#e2f5ee;border-color:#2d9e72;color:#1a6b4a}
.ch.no{background:#fff0f0;border-color:#e05050;color:#a03030}
.ch.dim{background:#f7f6f2;border-color:#e8e7e2;color:#bbb;cursor:default}
.qres{margin-top:1rem;display:none}.qres.on{display:block}
.qok{background:#e2f5ee;color:#1a6b4a;border-radius:10px;padding:9px 12px;margin-bottom:7px;font-size:14px}
.qno{background:#fff0f0;color:#a03030;border-radius:10px;padding:9px 12px;margin-bottom:7px;font-size:14px}
.qex{font-size:13px;color:#666;line-height:1.7;border-left:2px solid #e8e7e2;padding-left:10px;margin-top:6px}
.qex em{font-style:normal;font-weight:600;color:#1c1c1a}
.qnav{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.qct{font-size:13px;color:#bbb}
.filinput{width:100%;border:2px solid #e8e7e2;border-radius:10px;padding:12px;font-size:22px;font-family:'DM Serif Display',serif;outline:none;text-align:center;margin-bottom:10px;background:#fff;color:#1c1c1a;letter-spacing:1px;transition:border-color 0.15s}
.filinput:focus{border-color:#aaa}
.filinput.ok{border-color:#2d9e72;background:#e2f5ee;color:#1a6b4a}
.filinput.no{border-color:#e05050;background:#fff0f0;color:#a03030}
.summ{background:#fff;border:1px solid #e8e7e2;border-radius:16px;padding:1.5rem;margin-bottom:12px}
.summ-top{text-align:center;margin-bottom:1.25rem}
.spct{font-size:48px;font-family:'DM Serif Display',serif;font-weight:400;margin-bottom:4px}
.smsg{font-size:14px;color:#888;margin-bottom:1rem}
.summ-btns{display:flex;flex-direction:column;gap:8px}
.summ-row{display:flex;gap:8px}
.wrong-list{margin-top:1rem}
.wrong-list-title{font-size:12px;color:#aaa;margin-bottom:8px;font-weight:500;letter-spacing:0.3px}
.wrong-chips{display:flex;flex-wrap:wrap;gap:6px}
.wrong-chip{font-size:13px;background:#fff0f0;color:#a03030;border-radius:8px;padding:4px 10px;border:1px solid #fdd}
input[type=text]{font-family:'DM Sans',sans-serif;font-size:14px;color:#1c1c1a;background:#f7f6f2;border:1px solid #e8e7e2;border-radius:8px;outline:none;padding:9px 12px;width:100%}
input[type=text]:focus{border-color:#aaa}
input::placeholder{color:#ccc}
.loading{text-align:center;padding:3rem 1rem;color:#aaa;font-size:14px}
.spin{width:28px;height:28px;border:3px solid #e8e7e2;border-top-color:#999;border-radius:50%;animation:sp 0.7s linear infinite;margin:0 auto 1rem}
@keyframes sp{to{transform:rotate(360deg)}}
.err-box{background:#fff8f8;border:1px solid #f5d0d0;border-radius:14px;padding:1.5rem;text-align:center;color:#b44;font-size:14px;line-height:1.8}
.setup-box{background:#fff;border:1px solid #e8e7e2;border-radius:14px;padding:1.5rem;margin-bottom:12px}
.setup-box h3{font-size:15px;font-weight:600;margin-bottom:0.75rem}
.setup-box p{font-size:13px;color:#777;line-height:1.7;margin-bottom:0.75rem}
.setup-box code{background:#f0efe9;padding:2px 6px;border-radius:4px;font-size:12px;font-family:monospace}
.irow{display:flex;gap:8px}
input[type=url]{font-family:'DM Sans',sans-serif;font-size:13px;color:#1c1c1a;background:#f7f6f2;border:1px solid #e8e7e2;border-radius:8px;outline:none;padding:9px 12px;flex:1}
input[type=url]:focus{border-color:#aaa}
.astatus{font-size:12px;margin-top:6px}
.aok{color:#2d7a5f}.ano{color:#b44}
.reload-btn{display:flex;align-items:center;gap:6px;font-size:13px;color:#aaa;background:none;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;padding:0;margin-bottom:1rem}
.reload-btn:hover{color:#1c1c1a}

/* batch selector */
.batch-bar{background:#fff;border:1px solid #e8e7e2;border-radius:14px;padding:1rem 1.1rem;margin-bottom:12px}
.batch-bar-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.batch-label{font-size:13px;font-weight:500}
.batch-meta{font-size:12px;color:#aaa}
.batch-btns{display:flex;gap:6px;flex-wrap:wrap}
.bbtn{padding:6px 13px;border:1.5px solid #e8e7e2;border-radius:20px;font-size:12px;font-family:'DM Sans',sans-serif;background:#fff;cursor:pointer;color:#999;white-space:nowrap}
.bbtn.on{border-color:#1c1c1a;color:#1c1c1a;background:#f7f6f2}
.bbtn.has-wrong{border-color:#e8b4b4;color:#a03030;background:#fff8f8}
.bbtn.has-wrong.on{border-color:#e05050;background:#fff0f0}
.batch-size-row{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid #f0efe9}
.batch-size-label{font-size:12px;color:#aaa;white-space:nowrap}
select{font-family:'DM Sans',sans-serif;font-size:13px;color:#1c1c1a;background:#f7f6f2;border:1px solid #e8e7e2;border-radius:8px;outline:none;padding:6px 10px;cursor:pointer}

/* progress ring */
.prog-ring{display:inline-block;vertical-align:middle;margin-right:6px}
.story-card{background:#fff;border:1px solid #e8e7e2;border-radius:14px;padding:1.25rem 1.3rem;margin-bottom:14px}
.story-title{font-family:'DM Serif Display',serif;font-size:17px;font-weight:400;margin-bottom:4px;color:#1c1c1a}
.story-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.story-tag{font-size:11px;background:#e2f5ee;color:#1a6b4a;border-radius:20px;padding:2px 9px;cursor:pointer;border:1px solid #c5e8d8}
.story-tag:hover{background:#c5e8d8}
.story-body{font-size:14px;color:#444;line-height:1.9}
.story-body em{font-style:normal;font-weight:600;color:#1a6b4a;background:#f0fbf5;border-radius:3px;padding:0 2px}
.story-legend{margin-top:10px;padding-top:10px;border-top:1px solid #f0efe9;display:flex;flex-wrap:wrap;gap:6px}
.story-legend-item{font-size:12px;color:#777;line-height:1.8}
.story-legend-item strong{color:#1a6b4a;font-weight:500}
.gen-btn{width:100%;padding:11px;border-radius:10px;background:#f0fbf5;border:1.5px solid #c5e8d8;color:#1a6b4a;font-size:14px;font-family:'DM Sans',sans-serif;font-weight:500;cursor:pointer;margin-bottom:14px;transition:background 0.15s}
.gen-btn:hover{background:#e2f5ee}
.gen-btn:disabled{opacity:0.4;cursor:default}
.fav-empty{text-align:center;padding:3rem 1rem;color:#bbb;font-size:15px;line-height:2}
.fav-btn{background:none;border:none;cursor:pointer;font-size:18px;padding:2px 4px;line-height:1;opacity:0.35;transition:opacity 0.15s,transform 0.1s}
.fav-btn:hover{opacity:0.7}
.fav-btn.active{opacity:1;transform:scale(1.15)}
.note-area{width:100%;border:1px solid #e8e7e2;border-radius:8px;padding:8px 10px;font-size:13px;font-family:'DM Sans',sans-serif;color:#444;background:#fafaf7;resize:none;outline:none;min-height:52px;margin-top:6px;line-height:1.6}
.note-area:focus{border-color:#aaa}
.note-area::placeholder{color:#ccc}
.note-saved{font-size:11px;color:#2d7a5f;margin-top:3px;display:none}
.fav-card{background:#fff;border:1.5px solid #f5d68a;border-radius:14px;padding:1rem 1.1rem;margin-bottom:10px;animation:up 0.2s ease}
.fav-card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.fav-note-display{font-size:13px;color:#888;margin-top:6px;padding:6px 10px;background:#fffbee;border-radius:7px;border:1px solid #f5e89a;line-height:1.6;white-space:pre-wrap}
.exref-strip{margin-top:10px;display:flex;flex-direction:column;gap:5px;padding:8px 10px;background:#f7f6f2;border-radius:9px;border:1px solid #eeede8}
.exref-item{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;line-height:1.6}
.exref-word{font-size:13px;font-weight:600;color:#1c1c1a;min-width:80px}
.exref-pos{font-size:11px;background:#f0efe9;color:#777;border-radius:10px;padding:1px 7px;white-space:nowrap}
.exref-kk{font-size:11px;color:#aaa;font-family:monospace;white-space:nowrap}
.exref-zh{font-size:12px;color:#555}
</style>
</head>
<body>
<div id="app">
  <h1>單字練習工具</h1>
  <p class="sub" id="word-count">載入中...</p>

  <div id="setup-section">
    <div class="setup-box">
      <h3>📋 設定 Google Sheets 來源</h3>
      <p>把你的 Google Sheets 發布為 CSV，貼上網址即可同步單字庫。<br>
      步驟：試算表 → <strong>檔案 → 共用 → 發布到網路</strong> → 選 <strong>CSV</strong> → 複製連結</p>
      <div class="irow">
        <input type="url" id="sheetUrl" placeholder="https://docs.google.com/spreadsheets/d/.../pub?output=csv">
        <button class="btn btn-ink" onclick="saveSheet()">儲存</button>
      </div>
      <div class="astatus" id="sheetStatus"></div>
    </div>
  </div>

  <div id="main-section" style="display:none">
    <button class="reload-btn" onclick="reloadData()">↻ 重新從 Google Sheets 載入</button>
    <div class="tabs">
      <button class="tab on" onclick="go('quiz')">測驗</button>
      <button class="tab" onclick="go('bank')">單字庫</button>
      <button class="tab" onclick="go('fav')">⭐ 最愛</button>
      <button class="tab" onclick="go('stories')">故事</button>
      <button class="tab" onclick="go('settings')">設定</button>
    </div>

    <div class="sec on" id="sec-quiz">
      <!-- batch selector -->
      <div class="batch-bar">
        <div class="batch-bar-top">
          <span class="batch-label">練習範圍</span>
          <span class="batch-meta" id="batch-meta"></span>
        </div>
        <div class="batch-btns" id="batch-btns"></div>
        <div class="batch-size-row">
          <span class="batch-size-label">每批幾個：</span>
          <select id="batchSize" onchange="rebuildBatches()">
            <option value="20">20 個</option>
            <option value="30">30 個</option>
            <option value="50">50 個</option>
            <option value="0">全部</option>
          </select>
          <span class="batch-size-label" style="margin-left:8px">排序：</span>
          <select id="batchOrder" onchange="rebuildBatches()">
            <option value="original">照順序</option>
            <option value="random">隨機</option>
          </select>
        </div>
      </div>

      <div class="srow">
        <div class="sbox"><div class="sn" id="st">0</div><div class="sl">本批單字</div></div>
        <div class="sbox"><div class="sn green" id="sc">0</div><div class="sl">答對</div></div>
        <div class="sbox"><div class="sn red" id="sw">0</div><div class="sl">答錯</div></div>
        <div class="sbox"><div class="sn orange" id="swrong-total">0</div><div class="sl">累計錯誤</div></div>
      </div>
      <div class="mrow">
        <button class="mbtn on" id="m-mc" onclick="setMode('mc')">選擇題</button>
        <button class="mbtn" id="m-fill" onclick="setMode('fill')">填空拼字</button>
        <button class="mbtn" id="m-spoken" onclick="setMode('spoken')">口語判斷</button>
      </div>
      <div id="qa"></div>
    </div>

    <div class="sec" id="sec-bank">
      <div class="box" style="margin-bottom:12px">
        <input type="text" id="search" placeholder="搜尋單字或中文..." oninput="renderBank()">
      </div>
      <div id="bank-list"></div>
    </div>

    <div class="sec" id="sec-fav">
      <div id="fav-empty" class="fav-empty">還沒有最愛單字<br><span style="font-size:12px;color:#ccc">在單字庫或測驗中點 ⭐ 加入</span></div>
      <div id="fav-actions" style="display:none">
        <div style="display:flex;gap:8px;margin-bottom:12px">
          <button class="btn btn-ink" style="flex:1" onclick="startFavQuiz()">🎯 測驗最愛單字</button>
          <button class="btn btn-red" onclick="clearFavs()">清空</button>
        </div>
        <div id="fav-count" style="font-size:12px;color:#aaa;margin-bottom:10px"></div>
      </div>
      <div id="fav-list"></div>
    </div>

    <div class="sec" id="sec-stories">
      <div id="stories-list"></div>
    </div>

    <div class="sec" id="sec-settings">
      <div class="setup-box">
        <h3>Google Sheets 網址</h3>
        <p>更改資料來源，或重新載入最新單字。</p>
        <div class="irow">
          <input type="url" id="sheetUrl2" placeholder="https://docs.google.com/spreadsheets/d/.../pub?output=csv">
          <button class="btn btn-ink" onclick="saveSheet2()">更新</button>
        </div>
        <div class="astatus" id="sheetStatus2"></div>
        <br>
        <button class="btn btn-soft" onclick="reloadData()">↻ 重新載入單字</button>
        <br><br>
        <button class="btn btn-red" onclick="clearWrong()">清除所有錯誤紀錄</button>
      </div>
    </div>
  </div>

  <div id="loading-section" style="display:none">
    <div class="loading"><div class="spin"></div>載入單字中...</div>
  </div>
  <div id="error-section" style="display:none">
    <div class="err-box" id="err-msg"></div>
  </div>
</div>

<script>
const SHEET_KEY = 'vocab_sheet_url';
const WRONG_KEY = 'vocab_wrong_v1';
const FAV_KEY   = 'vocab_fav_v1';

let vocab = [], batches = [], currentBatch = 0;
let deck = [], idx = 0, mode = 'mc', score = {c:0,w:0}, done = false;
let wrongWords = {};
let favWords   = {};
let sessionWrong = new Set();

/* ── persistence ── */
function loadWrong(){ try{ wrongWords = JSON.parse(localStorage.getItem(WRONG_KEY)||'{}'); }catch{ wrongWords={}; } }
function saveWrong(){ localStorage.setItem(WRONG_KEY, JSON.stringify(wrongWords)); }
function clearWrong(){ if(!confirm('確定清除所有錯誤紀錄？')) return; wrongWords={}; saveWrong(); sessionWrong=new Set(); rebuildBatches(); alert('已清除'); }
function totalWrongCount(){ return Object.keys(wrongWords).length; }

function loadFavs(){ try{ favWords = JSON.parse(localStorage.getItem(FAV_KEY)||'{}'); }catch{ favWords={}; } }
function saveFavs(){ localStorage.setItem(FAV_KEY, JSON.stringify(favWords)); }

/* ── sheet ── */
function loadSheet(){
  const url = localStorage.getItem(SHEET_KEY)||'';
  if(url){
    document.getElementById('sheetUrl').value = url;
    document.getElementById('sheetUrl2').value = url;
    document.getElementById('setup-section').style.display = 'none';
    fetchVocab(url);
  }
}
function saveSheet(){ doSaveSheet(document.getElementById('sheetUrl').value.trim(), 'sheetStatus'); }
function saveSheet2(){ doSaveSheet(document.getElementById('sheetUrl2').value.trim(), 'sheetStatus2'); }
function doSaveSheet(url, sid){
  if(!url.includes('docs.google.com')){ setStatus(sid,'請貼上正確的 Google Sheets 網址',false); return; }
  localStorage.setItem(SHEET_KEY, url);
  setStatus(sid,'已儲存，載入中...',true);
  document.getElementById('setup-section').style.display = 'none';
  fetchVocab(url);
}
function setStatus(id,msg,ok){ const e=document.getElementById(id); e.textContent=msg; e.className='astatus '+(ok?'aok':'ano'); }
function reloadData(){ const url=localStorage.getItem(SHEET_KEY)||''; if(url) fetchVocab(url); }

async function fetchVocab(url){
  document.getElementById('loading-section').style.display = 'block';
  document.getElementById('main-section').style.display = 'none';
  document.getElementById('error-section').style.display = 'none';
  let csvUrl = url.includes('output=csv') ? url : url.split('?')[0]+'?output=csv';
  csvUrl += '&t='+Date.now();
  try{
    const res = await fetch(csvUrl);
    if(!res.ok) throw new Error('HTTP '+res.status);
    const text = await res.text();
    vocab = parseCSV(text);
    if(!vocab.length) throw new Error('試算表是空的，或格式不正確');
    buildVocabMap();
    document.getElementById('loading-section').style.display = 'none';
    document.getElementById('main-section').style.display = 'block';
    document.getElementById('word-count').textContent = vocab.length+' 個單字 · KK音標 · 口語程度 · 三種測驗';
    rebuildBatches();
  }catch(e){
    document.getElementById('loading-section').style.display = 'none';
    document.getElementById('error-section').style.display = 'block';
    document.getElementById('err-msg').innerHTML = `<strong>載入失敗</strong><br><br>錯誤：${e.message}<br><br>
      請確認：<br>1. 試算表已發布（檔案 → 共用 → 發布到網路）<br>2. 格式選 <strong>CSV</strong><br>
      3. 網址包含 <code>/pub?output=csv</code><br><br>
      <button class="btn btn-ink" onclick="document.getElementById('error-section').style.display='none';document.getElementById('setup-section').style.display='block'">重新設定</button>`;
  }
}

/* ── CSV ── */
function parseCSV(text){
  const lines = text.trim().split('\n');
  if(lines.length < 2) return [];
  const header = parseCSVRow(lines[0]).map(h=>h.trim().toLowerCase());
  const results = [];
  for(let i=1;i<lines.length;i++){
    if(!lines[i].trim()) continue;
    const cols = parseCSVRow(lines[i]);
    const obj = {}; header.forEach((h,j)=>{ obj[h]=(cols[j]||'').trim(); });
    if(!obj.word) continue;
    results.push({ word:obj.word, pos:obj.pos||'', kk:obj.kk||'', chinese:obj.chinese||'',
      is_spoken: obj.is_spoken&&obj.is_spoken.toUpperCase()==='TRUE',
      spoken_alternative:obj.spoken_alternative||'', example:obj.example||'' });
  }
  return results;
}
function parseCSVRow(row){
  const result=[]; let cur='',inQ=false;
  for(let i=0;i<row.length;i++){
    const c=row[i];
    if(c==='"'){ if(inQ&&row[i+1]==='"'){cur+='"';i++;}else inQ=!inQ; }
    else if(c===','&&!inQ){result.push(cur);cur='';}
    else cur+=c;
  }
  result.push(cur); return result;
}

/* ── BATCHES ── */
function rebuildBatches(){
  const size = parseInt(document.getElementById('batchSize').value);
  const order = document.getElementById('batchOrder').value;
  let pool = [...vocab];
  if(order === 'random') pool = shuf(pool);
  if(size === 0){
    batches = [pool];
  } else {
    batches = [];
    for(let i=0;i<pool.length;i+=size) batches.push(pool.slice(i,i+size));
  }
  // clamp currentBatch
  if(currentBatch >= batches.length) currentBatch = 0;
  renderBatchBtns();
  startBatch(currentBatch);
}

    b.onclick = ()=>{ currentBatch=i; renderBatchBtns(); startBatch(i); };

    batches.length===1 ? `共 ${vocab.length} 個` :

  document.getElementById('swrong-total').textContent = wc;
}

/* ── QUIZ RENDER ── */
function bold(s,w){
  return (s||'').replace(/\*\*([^*]+)\*\*/g,'<em>$1</em>')
    .replace(new RegExp('\\b('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')\\b','gi'),'<em>$1</em>');
}

// Extract all **bolded** words from an example sentence
function extractBoldWords(example){
  const matches = [];
  const re = /\*\*([^*]+)\*\*/g;
  let m;
  while((m = re.exec(example)) !== null){
    const w = m[1].trim();
    if(w) matches.push(w);
  }
  return [...new Set(matches)];
}

// Build a vocab lookup map (lowercase word -> entry)
let vocabMap = {};
function buildVocabMap(){
  vocabMap = {};
  vocab.forEach(v => { vocabMap[v.word.toLowerCase()] = v; });
}

// Find a vocab entry for a bold word (handles multi-word phrases)
function findEntry(w){
  const lw = w.toLowerCase();
  if(vocabMap[lw]) return vocabMap[lw];
  // Try without trailing 's', 'ed', 'ing', 'ly'
  const stems = [
    lw.replace(/ing$/, ''), lw.replace(/ed$/, ''), lw.replace(/s$/, ''),
    lw.replace(/ly$/, ''), lw.replace(/ness$/, ''), lw.replace(/tion$/, 'te'),
  ];
  for(const s of stems){
    if(vocabMap[s]) return vocabMap[s];
  }
  return null;
}

// Build the inline word reference strip below an example
function buildExRefStrip(example, mainWord){
  const boldWords = extractBoldWords(example);
  const refs = [];
  for(const w of boldWords){
    if(w.toLowerCase() === mainWord.toLowerCase()) continue; // skip the card's own word
    const entry = findEntry(w);
    if(entry){
      refs.push(`<span class="exref-item">
        <span class="exref-word">${entry.word}</span>
        <span class="exref-pos">${entry.pos}</span>
        <span class="exref-kk">${entry.kk}</span>
        <span class="exref-zh">${entry.chinese}</span>
      </span>`);
    }
  }
  if(!refs.length) return '';
  return `<div class="exref-strip">${refs.join('')}</div>`;
}

function isFav(word){ return !!favWords[word]; }
function toggleFav(word){
  if(favWords[word]){ delete favWords[word]; }
  else { favWords[word] = {note:''}; }
  saveFavs();
  document.querySelectorAll(`.fav-btn[data-word="${word}"]`).forEach(b=>{
    b.classList.toggle('active', isFav(word));
    b.title = isFav(word) ? '移除最愛' : '加入最愛';
  });
}
function saveFavNote(word, note){
  if(!favWords[word]) favWords[word]={note:''};
  favWords[word].note = note;
  saveFavs();
}
let noteTimers={};
function debounceSaveNote(word,val){
  clearTimeout(noteTimers[word]);
  noteTimers[word]=setTimeout(()=>{
    saveFavNote(word,val);
    const el=document.getElementById('note-saved-'+word);
    if(el){el.style.display='block';setTimeout(()=>el.style.display='none',1500);}
  },600);
}

function mkWCard(d, inFavTab){

  const favActive=isFav(d.word)?'active':'';

  const noteHtml = inFavTab
    ? `<textarea class="note-area" placeholder="寫下筆記、記憶法、難點…" oninput="debounceSaveNote('${d.word}',this.value)">${noteVal}</textarea>
       <div class="note-saved" id="note-saved-${d.word}">已儲存 ✓</div>`

    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:6px;margin-bottom:4px">
      <div class="whead" style="margin-bottom:0;flex:1">

function setMode(m){
  mode=m;['mc','fill','spoken'].forEach(id=>document.getElementById('m-'+id).classList.toggle('on',id===m));
  if(currentBatch===-1) startWrongReview(); else startBatch(currentBatch);
}
function updScore(){ document.getElementById('sc').textContent=score.c; document.getElementById('sw').textContent=score.w; }
function shuf(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function render(){
  const qa=document.getElementById('qa');
  if(idx>=deck.length){renderSum(qa);return;}
  const item=deck[idx];done=false;
  if(mode==='mc') renderMC(qa,item);
  else if(mode==='fill') renderFill(qa,item);
  else renderSpoken(qa,item);
}
function nav(){return`<div class="qnav"><span class="qct">${idx+1} / ${deck.length}</span><button class="btn btn-ink" id="nxt" onclick="next()" style="display:none">下一題 →</button></div>`;}

function renderMC(qa,item){
  // pick distractors from whole vocab for more variety
  const others=shuf(vocab.filter(v=>v.word!==item.word)).slice(0,3).map(v=>v.chinese);
  const choices=shuf([item.chinese,...others]);
  qa.innerHTML=`<div class="qcard"><div class="qword">${item.word}</div><div class="qkk">${item.kk}</div><div class="qpos">${item.pos}</div>
<div class="qprompt">選出正確的中文意思</div>
<div class="choices">${choices.map(c=>`<button class="ch" onclick="chkMC(this,'${esc(c)}','${esc(item.chinese)}')">${c}</button>`).join('')}</div>
<div class="qres" id="qr"></div></div>${nav()}`;
}
function chkMC(btn,chosen,correct){
  if(done)return;done=true;const ok=chosen===correct;
  recordResult(deck[idx].word,ok);
  if(ok){score.c++;btn.classList.add('ok');}
  else{score.w++;btn.classList.add('no');document.querySelectorAll('.ch').forEach(b=>{if(b.textContent.trim()===correct)b.classList.add('ok');else if(!b.classList.contains('no'))b.classList.add('dim');});}
  updScore();showRes(ok);
}

function renderFill(qa,item){
  qa.innerHTML=`<div class="qcard"><div class="qpos" style="margin-bottom:4px">${item.pos}</div>
<div class="qword" style="font-size:18px;font-family:'DM Sans',sans-serif;color:#888;font-weight:400;margin-bottom:4px">${item.chinese}</div>
<div class="qkk" style="text-align:center;margin-bottom:1rem">${item.kk}</div>
<div class="qprompt">拼出這個英文單字</div>
<input class="filinput" id="fi" type="text" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" placeholder="輸入英文...">
<div style="text-align:center"><button class="btn btn-ink" onclick="chkFill('${esc(item.word)}')">確認</button></div>
<div class="qres" id="qr"></div></div>${nav()}`;
  const fi=document.getElementById('fi');fi.focus();
  fi.addEventListener('keydown',e=>{if(e.key==='Enter')chkFill(item.word);});
}
function chkFill(correct){
  if(done)return;const fi=document.getElementById('fi');const val=fi.value.trim().toLowerCase();if(!val)return;
  done=true;const ok=val===correct.toLowerCase();
  recordResult(correct,ok);
  fi.classList.add(ok?'ok':'no');if(ok)score.c++;else{score.w++;fi.value=correct;}
  updScore();showRes(ok);
}

function renderSpoken(qa,item){
  qa.innerHTML=`<div class="qcard"><div class="qword">${item.word}</div><div class="qkk">${item.kk}</div>
<div class="qpos">${item.pos} — ${item.chinese}</div>
<div class="qprompt" style="margin-top:1rem">這個單字在日常口語中常用嗎？</div>
<div class="choices" style="flex-direction:row;gap:10px;display:flex">
  <button class="ch" style="flex:1;text-align:center" onclick="chkSpoken(this,true,${item.is_spoken})">是，口語常用</button>
  <button class="ch" style="flex:1;text-align:center" onclick="chkSpoken(this,false,${item.is_spoken})">不是，較書面</button>
</div>
<div class="qres" id="qr"></div></div>${nav()}`;
}
function chkSpoken(btn,chosen,correct){
  if(done)return;done=true;const ok=chosen===correct;
  recordResult(deck[idx].word,ok);
  if(ok){score.c++;btn.classList.add('ok');}
  else{score.w++;btn.classList.add('no');document.querySelectorAll('.ch').forEach(b=>{const bv=b.textContent.includes('口語');if(bv===correct)b.classList.add('ok');else if(!b.classList.contains('no'))b.classList.add('dim');});}
  updScore();showRes(ok);
}

function recordResult(word, ok){
  if(!ok){
    wrongWords[word] = (wrongWords[word]||0)+1;
    sessionWrong.add(word);
  } else {
    // answered correctly this time — remove from wrong list
    delete wrongWords[word];
    sessionWrong.delete(word);
  }
  saveWrong();
  document.getElementById('swrong-total').textContent = totalWrongCount();
}

function showRes(ok){
  const item=deck[idx],el=document.getElementById('qr');
  const alt=(!item.is_spoken&&item.spoken_alternative)?`<div style="margin-top:6px;font-size:13px">口語說法：${item.spoken_alternative}</div>`:'';
  const favActive=isFav(item.word)?'active':'';
  const refStrip = buildExRefStrip(item.example, item.word);
  el.className='qres on';
  el.innerHTML=`<div class="${ok?'qok':'qno'}">${ok?'答對了！':'答錯了 — 正確答案：'+item.chinese}</div>${alt}
<div class="qex">${bold(item.example,item.word)}</div>
${refStrip}
<div style="display:flex;align-items:center;gap:8px;margin-top:8px">
  <button class="fav-btn ${favActive}" data-word="${item.word}" title="${isFav(item.word)?'移除最愛':'加入最愛'}" onclick="toggleFav('${item.word}');document.querySelectorAll('.fav-btn[data-word=\\'${item.word}\\']').forEach(b=>{b.classList.toggle('active',isFav('${item.word}'));})">⭐ ${isFav(item.word)?'已加入最愛':'加入最愛'}</button>
</div>`;
  document.getElementById('nxt').style.display='inline-block';
}
function next(){idx++;done=false;render();}

function renderSum(qa){
  const total=score.c+score.w,pct=total?Math.round(score.c/total*100):0;
  const msg=pct>=80?'很棒，繼續保持！':pct>=50?'還不錯，再複習一下！':'繼續加油！';

  // wrong words in this round
  const wrongThisRound = deck.filter(w=>wrongWords[w.word]);
  const wrongChips = wrongThisRound.length
    ? `<div class="wrong-list">
        <div class="wrong-list-title">本輪答錯（${wrongThisRound.length} 個）</div>
        <div class="wrong-chips">${wrongThisRound.map(w=>`<span class="wrong-chip">${w.word}</span>`).join('')}</div>
       </div>` : '';

  const hasWrong = totalWrongCount() > 0;

  qa.innerHTML=`<div class="summ">
  <div class="summ-top">
    <div class="spct">${pct}%</div>
    <div class="smsg">${score.c} / ${total} 答對 &nbsp;·&nbsp; ${msg}</div>
  </div>
  ${wrongChips}
  <div class="summ-btns" style="margin-top:1.25rem">
    <div class="summ-row">
      <button class="btn btn-ink" style="flex:1" onclick="reAll()">再來一次（本批）</button>
      ${currentBatch!==-1&&batches.length>1?`<button class="btn btn-soft" style="flex:1" onclick="nextBatch()">下一批 →</button>`:''}
    </div>
    ${hasWrong?`<button class="btn btn-red btn-full" onclick="startWrongReview()">🔁 複習全部錯題（${totalWrongCount()} 個）</button>`:''}
    ${wrongThisRound.length?`<button class="btn btn-orange btn-full" onclick="replayThisWrong()">重練本輪答錯（${wrongThisRound.length} 個）</button>`:''}
  </div>
</div>`;
}

function reAll(){ if(currentBatch===-1) startWrongReview(); else if(currentBatch===-2) startSpokenReview(); else if(currentBatch===-3) startFavQuiz(); else startBatch(currentBatch); }
function nextBatch(){
  const next=(currentBatch+1)%batches.length;
  startBatch(next);
}
function replayThisWrong(){
  // replay only words wrong in current deck
  const wrongList = deck.filter(w=>wrongWords[w.word]);
  if(!wrongList.length) return;
  deck = shuf(wrongList);
  document.getElementById('st').textContent = deck.length;
  score={c:0,w:0};updScore();idx=0;done=false;render();
}

function esc(s){return(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'")}

/* ── SPOKEN STORIES ── */
const STORIES = [

    body:`Every language learner hits a **plateau** at some point. You feel **stuck**, your **day-to-day** practice feels **mundane**, and progress seems invisible. The key is not to panic — instead, **ramp up** variety in how you study. （每個語言學習者在某個時候都會遇到停滯期。你感到卡住，日常練習感覺單調，進步似乎看不見。關鍵是不要恐慌——相反，增加學習方式的多樣性。）

Start each session by **warm**ing **up** with easy material you already know, then **go over** new vocabulary carefully. **Brush up on** phrases you've forgotten rather than chasing new ones. **Keep up** the consistency even on hard days — **hang in** there and **wind down** properly after each session so your brain consolidates. Over time, **fluidity** will return naturally. （每次學習開始時先用你已經知道的簡單材料熱身，然後仔細複習新詞彙。溫習你已經忘記的片語，而不是追逐新的。即使在困難的日子也要保持一致性——堅持下去，每次學習後適當放鬆，讓你的大腦鞏固記憶。隨著時間的推移，流暢度將自然恢復。）`

The solution isn't dramatic — it's **day-to-day** **awareness** of your **boundaries**. **Wind down** properly each evening. **Once in a while**, **stop and smell the roses**: take a slow walk, enjoy a meal without your phone, let yourself **dim** the noise. **Hang in** there on hard days, but also know when to rest. That balance is what makes **consistent** high performance **sustainable**. （解決方案並不戲劇化——這是對你界線的日常意識。每天晚上適當放鬆。偶爾停下來欣賞生活：慢慢散步，享受不看手機的一餐，讓自己淡化噪音。在困難的日子堅持下去，但也要知道何時休息。那種平衡是讓持續高績效可持續的關鍵。）`

The irony is that **artificial** presentation often **backfires**. A **candid** moment — a **confess**ion of a mistake, a real laugh, a **briefly** dropped guard — does more to build trust than any polished pitch. **Attentiveness** to the other person, not a rehearsed **demeanor**, is what creates truly **meaningful** connection. And connection, not performance, is what **outlasts** every **scam**. （諷刺的是，人工呈現往往適得其反。一個坦誠的時刻——承認錯誤、真實的笑聲、短暫地放下防備——比任何精心準備的推銷更能建立信任。對另一個人的細心，而不是排練過的舉止，才是創造真正有意義連接的關鍵。而連接，而非表演，才是比任何騙局都更持久的東西。）`

function renderStories(){
  const el = document.getElementById('stories-list');
  el.innerHTML = '';

  const intro = document.createElement('div');
  intro.style.cssText = 'font-size:13px;color:#888;margin-bottom:14px;line-height:1.7';
  intro.innerHTML = '每篇短文包含多個 <span style="color:#1a6b4a;font-weight:500">口語常用單字</span>，單字互相引用加深記憶。點擊標籤可快速查詢單字庫。';
  el.appendChild(intro);

  STORIES.forEach(s => {
    const card = document.createElement('div');
    card.className = 'story-card';

    // highlight words in body
    let body = s.body;
    // bold markdown
    body = body.replace(/\*\*([^*]+)\*\*/g, '<em>$1</em>');

    // build word legend from vocab
    const wordDefs = s.words.map(w => {
      const found = vocab.find(v => v.word.toLowerCase() === w.toLowerCase());
      return found ? `<span class="story-legend-item"><strong>${found.word}</strong> ${found.chinese}</span>` : '';
    }).filter(Boolean).join('');

    card.innerHTML = `
      <div class="story-title">${s.title}</div>
      <div class="story-tags">${s.words.map(w=>`<span class="story-tag" onclick="searchWord('${w}')">${w}</span>`).join('')}</div>
      <div class="story-body">${body}</div>
      ${wordDefs ? `<div class="story-legend">${wordDefs}</div>` : ''}
    `;
    el.appendChild(card);
  });
}

function searchWord(w){
  go('bank');
  document.getElementById('search').value = w;
  renderBank();
}
